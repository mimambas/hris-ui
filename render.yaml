# HRIS Backend on Render (free web service)
services:
  - type: web
    name: hris-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: HRIS
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_ADMIN_EMAIL
        value: admin@hris.local
      - key: SEED_ADMIN_PASSWORD
        sync: false
