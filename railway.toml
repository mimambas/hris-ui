# Railway deployment
# Railway can run this service with a PostgreSQL DATABASE_URL variable.
# The start command is intentionally production-safe and uses Railway's PORT.
[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
